/* Parser de CSV simples com suporte a valores entre aspas (contendo vírgula). */
function parseCSV_(texto) {
  const linhas = [];
  let linhaAtual = [];
  let campoAtual = '';
  let dentroAspas = false;

  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (dentroAspas) {
      if (c === '"') {
        if (texto[i + 1] === '"') { campoAtual += '"'; i++; }
        else { dentroAspas = false; }
      } else {
        campoAtual += c;
      }
    } else if (c === '"') {
      dentroAspas = true;
    } else if (c === ',') {
      linhaAtual.push(campoAtual);
      campoAtual = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && texto[i + 1] === '\n') i++;
      linhaAtual.push(campoAtual);
      campoAtual = '';
      linhas.push(linhaAtual);
      linhaAtual = [];
    } else {
      campoAtual += c;
    }
  }
  if (campoAtual !== '' || linhaAtual.length) {
    linhaAtual.push(campoAtual);
    linhas.push(linhaAtual);
  }
  return linhas.filter((l) => l.some((campo) => String(campo).trim() !== ''));
}

/* Converte o CSV bruto (com cabeçalho id,nome,funcao,lojaId,ativo) em objetos
   de colaborador no mesmo formato que o restante do dashboard já espera. */
function csvParaColaboradores_(texto) {
  const linhas = parseCSV_(texto);
  if (!linhas.length) return [];

  const cabecalho = linhas[0].map((c) => String(c).trim().toLowerCase());
  const idxId = cabecalho.indexOf('id');
  const idxNome = cabecalho.indexOf('nome');
  const idxFuncao = cabecalho.indexOf('funcao');
  const idxLoja = cabecalho.indexOf('lojaid');
  const idxAtivo = cabecalho.indexOf('ativo');

  return linhas.slice(1)
    .filter((l) => l[idxId] && String(l[idxId]).trim() !== '')
    .map((l) => {
      const ativoBruto = idxAtivo > -1 ? String(l[idxAtivo]).trim().toLowerCase() : '';
      const ativo = ativoBruto === '' ? true : !['false', '0', 'não', 'nao', 'n', 'inativo'].includes(ativoBruto);
      return {
        id: String(l[idxId]).trim(),
        nome: String(l[idxNome] || '').trim(),
        funcao: String(l[idxFuncao] || '').trim(),
        lojaId: String(l[idxLoja] || '').trim(),
        ativo,
      };
    });
}

/* Busca e converte o CSV de colaboradores. Lança erro em caso de falha —
   quem chamar decide como tratar (mensagem na tela, retry, etc). */
function normalizarAvaliacao_(a) {
  if (!a || typeof a !== 'object') return null;

  let scores = a.scores;
  if ((scores === undefined || scores === null || typeof scores !== 'object') && a.scoresJson) {
    try {
      scores = typeof a.scoresJson === 'string' ? JSON.parse(a.scoresJson) : a.scoresJson;
    } catch (_) {
      scores = {};
    }
  }

  return {
    ...a,
    id: String(a.id ?? ''),
    funcionarioId: String(a.funcionarioId ?? ''),
    lojaId: String(a.lojaId ?? ''),
    mes: String(a.mes ?? ''),
    semana: Number(a.semana ?? 0),
    data: a.data ?? '',
    gestor: a.gestor ?? '',
    scores: scores && typeof scores === 'object' ? scores : {},
    observacao: a.observacao ?? '',
  };
}

function normalizarColaborador_(f) {
  if (!f || typeof f !== 'object') return null;
  const ativoBruto = String(f.ativo ?? '').trim().toLowerCase();

  return {
    id: String(f.id ?? f.funcionarioId ?? '').trim(),
    nome: String(f.nome ?? f.name ?? '').trim(),
    funcao: String(f.funcao ?? f.funcaoNome ?? f.cargo ?? '').trim(),
    lojaId: String(f.lojaId ?? f.loja ?? '').trim(),
    ativo: ativoBruto === '' ? true : !['false', '0', 'não', 'nao', 'n', 'inativo'].includes(ativoBruto),
  };
}

function validarColaboradores_(lista) {
  return (Array.isArray(lista) ? lista : [])
    .map(normalizarColaborador_)
    .filter((f) => f && f.id && f.nome && f.lojaId);
}

  const funcionarios = validarColaboradores_(json.funcionarios || json.colaboradores || []);
  const avaliacoes = (Array.isArray(json.avaliacoes) ? json.avaliacoes : [])

    .filter(Boolean);

  if (!funcionarios.length) {
    throw new Error(
      'O Apps Script respondeu, mas não retornou funcionarios[]. ' +
      'Verifique se a aba base_colaboradores existe e se o Code.gs foi atualizado para devolvê-la.'
    );
  }

  return { funcionarios, avaliacoes };
}

async function carregarHistoricoCSVFallback_() {

    throw new Error(`Falha ao buscar histórico CSV (HTTP ${resp.status}).`);

  const texto = await resp.text();
  const linhas = parseCSV_(texto);

  if (!linhas.length) return [];

  const cab = linhas[0].map((c) => String(c).trim().toLowerCase());
  const idx = (nome) => cab.indexOf(nome.toLowerCase());

  return linhas.slice(1)
    .filter((l) => l.some((v) => String(v).trim() !== ''))
    .map((l) => normalizarAvaliacao_({
      id: l[idx('id')],
      funcionarioId: l[idx('funcionarioid')],
      lojaId: l[idx('lojaid')],

    }))
    .filter((a) => a && a.funcionarioId && a.mes);
}

/* PRNG determinístico simples para gerar dados de exemplo estáveis */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return h; }

  const base = [...CRITERIOS_COMUNS, ...(CRITERIOS_FUNCAO[funcao] || [])];

  if (!overrides) return base;
  return base.map((c) => (overrides[c.id] ? { ...c, label: overrides[c.id] } : c));
}

function gerarNotaCriterio(rand, bias) {
  const v = bias + (rand() - 0.5) * 1.6;
  return Math.max(1, Math.min(5, Math.round(v)));
}

function mediaObj(scores) {
  const vals = Object.values(scores);
  if (!vals.length) return 0;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function classificar(nota5) {
  if (nota5 >= 4.5) return { label: 'Excelente', cor: 'emerald' };
  if (nota5 >= 3.5) return { label: 'Bom', cor: 'blue' };
  if (nota5 >= 2.5) return { label: 'Regular', cor: 'amber' };

function gerarDiagnosticoParagrafo_(label, nota, funcao) {
  const grave = nota <= 1.5;
  const abertura = grave
    ? `A avaliação aponta uma necessidade relevante de desenvolvimento em ${label}`
    : `A avaliação demonstra uma oportunidade de desenvolvimento em ${label}`;
  return `${abertura}. Quando esse comportamento ocorre de forma recorrente, pode impactar a organização das atividades, a produtividade da equipe e a experiência dos clientes, especialmente na rotina de um(a) ${funcao}.`;
}

function calcularPrioridadeCriterio_(nota) {
  if (nota <= 1.5) return { label: 'Prioridade Alta', emoji: '🟠', cor: 'orange' };
  return { label: 'Prioridade Média', emoji: '🟡', cor: 'yellow' };
}

function calcularPrioridadeGeral_(criteriosBaixos, totalAbaixoDe3) {
  if (totalAbaixoDe3 >= 5) return { label: 'Atenção Imediata', emoji: '🚨', cor: 'red', prazo: 30 };
  const notasCriticas = criteriosBaixos.filter((c) => c.nota <= 2).length;
  if (notasCriticas >= 3) return { label: 'Prioridade Crítica', emoji: '🔴', cor: 'red', prazo: 30 };
  if (criteriosBaixos.some((c) => c.nota <= 1.5)) return { label: 'Prioridade Alta', emoji: '🟠', cor: 'orange', prazo: 45 };
  if (criteriosBaixos.length > 0) return { label: 'Prioridade Média', emoji: '🟡', cor: 'yellow', prazo: 60 };
  return null;
}

function gerarPlanoAcao_(prioridade) {
  const plano = [
    'Realizar uma conversa de feedback individual, em local reservado',
    'Investigar junto ao colaborador a possível causa raiz',
    'Definir metas claras e mensuráveis para o próximo ciclo',
    'Acompanhar semanalmente a evolução do comportamento',
    'Registrar formalmente a evolução observada nas próximas avaliações',
    'Oferecer orientação prática e, se necessário, treinamento específico',
  ];
  if (prioridade && (prioridade.label === 'Prioridade Crítica' || prioridade.label === 'Atenção Imediata')) {
    plano.push('Formalizar um Plano de Desenvolvimento Individual (PDI) com metas e prazos definidos');
  }
  plano.push(`Reavaliar formalmente em até ${prioridade ? prioridade.prazo : 60} dias`);
  return plano;
}

/* ============================= INTEGRAÇÃO COM GOOGLE SHEETS (APPS SCRIPT) ============================= */

// Faz o parse da resposta com segurança. Se a implantação do Apps Script
// estiver desatualizada, com acesso restrito, ou a URL estiver errada, o
// Google costuma responder com uma página HTML (ex.: tela de login) em vez
// de JSON. Sem esse tratamento, isso vira um erro genérico tipo
// "Unexpected token < in JSON" que não diz nada sobre a causa real.
async function parseRespostaApi_(resp) {
  const texto = await resp.text();
  let json;
  try {
    json = JSON.parse(texto);
  } catch (e) {
    throw new Error(
      `A API não retornou JSON válido (status HTTP ${resp.status}). ` +
      'Isso normalmente indica que: (1) a implantação do Apps Script está ' +
      'desatualizada — edite o Code.gs e crie uma NOVA implantação (não basta salvar); ' +
      '(2) o acesso da implantação não está como "Qualquer pessoa"; ou ' +
      '(3) CONFIG.API_URL não é a URL da implantação mais recente. ' +
      `Início da resposta recebida: "${texto.slice(0, 150)}"`
    );
  }
  return json;
}

async function apiCarregarAvaliacoes() {
  // cache: 'no-store' + timestamp evitam que o navegador reutilize uma resposta
  // antiga (ex.: vazia) da mesma URL em vez de buscar os dados atuais da planilha.
  const resp = await fetch(`${CONFIG.API_URL}?_=${Date.now()}`, { method: 'GET', cache: 'no-store' });
  const json = await parseRespostaApi_(resp);
  if (!json.ok) throw new Error(json.erro || 'Falha ao carregar avaliações.');
  return json.avaliacoes;
}

async function apiSalvarAvaliacao(avaliacao) {
  // Envio como text/plain evita o preflight OPTIONS, que o Apps Script não trata bem.
  const resp = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(avaliacao),
  });
  const json = await parseRespostaApi_(resp);
  if (!json.ok) throw new Error(json.erro || 'Falha ao salvar avaliação.');
  return json.avaliacao;
}

function SyncStatus({ status, erro, onRetry }) {
  if (status === 'syncing') {
    return <span className="text-xs text-slate-400 flex items-center gap-1.5 px-2">⏳ Sincronizando...</span>;
  }
  if (status === 'erro') {
    return (
      <button onClick={onRetry} title={erro} className="text-xs text-red-400 hover:text-red-300 flex items-center gap-1.5 px-2 underline decoration-dotted">
        ⚠️ Erro de sincronização — tentar de novo
      </button>
    );
  }
  if (status === 'ok') {
    return <span className="text-xs text-emerald-400 flex items-center gap-1.5 px-2">✅ Sincronizado</span>;
  }
  return null;
}

function LineChart({ labels, data, id }) {

  useEffect(() => {

    chartRef.current = new Chart(ref.current, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Média mensal da loja',
          data,
          borderColor: '#818cf8',
          backgroundColor: 'rgba(129,140,248,0.15)',

          pointRadius: 4,

          y: { min: 0, max: 5, ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },

function ModalAvaliacao({ funcionario, mes, semana, existente, onClose, onSave }) {
  const criterios = criteriosDaFuncao(funcionario.funcao);
  const [scores, setScores] = useState(existente ? { ...existente.scores } : {});
  const [gestor, setGestor] = useState(existente ? existente.gestor : '');
  const [observacao, setObservacao] = useState(existente ? existente.observacao : '');
  const [data, setData] = useState(existente ? existente.data : new Date().toISOString().slice(0, 10));
  const [salvando, setSalvando] = useState(false);
  const [erroSalvar, setErroSalvar] = useState('');

  const preenchido = criterios.every((c) => scores[c.id]);
  const media = preenchido ? mediaObj(scores) : 0;

  async function handleSalvar() {
    setSalvando(true);
    setErroSalvar('');
    try {
      await onSave({ scores, gestor, observacao, data });
    } catch (err) {
      setErroSalvar(err.message || 'Erro ao salvar. Verifique sua conexão e tente novamente.');
      setSalvando(false);

  return (
    <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4 no-print">
      <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto fade-in">
        <div className="p-5 border-b border-slate-800 flex items-center justify-between sticky top-0 bg-slate-900 z-10">
          <div>
            <h3 className="font-bold text-lg">{funcionario.nome}</h3>
            <p className="text-xs text-slate-400">{funcionario.funcao} · Semana {semana} · {mes}</p>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-white text-xl leading-none">×</button>
        </div>

        <div className="p-5 space-y-5">
          {criterios.map((c) => (
            <div key={c.id}>
              <div className="flex items-center justify-between mb-2">
                <label className="text-sm font-medium text-slate-200">{c.label}</label>
                {scores[c.id] && <span className="text-xs text-slate-400">{ESCALA_LABELS[scores[c.id]]}</span>}
              </div>
              <StarScore value={scores[c.id]} onChange={(v) => setScores({ ...scores, [c.id]: v })} />
            </div>
          ))}

          <div className="grid grid-cols-2 gap-3 pt-2">
            <div>
              <label className="text-xs text-slate-400">Data da avaliação</label>
              <input type="date" value={data} onChange={(e) => setData(e.target.value)}
                className="mt-1 w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
            </div>
            <div>
              <label className="text-xs text-slate-400">Responsável (gestor)</label>
              <input type="text" value={gestor} onChange={(e) => setGestor(e.target.value)} placeholder="Nome do gestor"
                className="mt-1 w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
            </div>
          </div>

          <div>
            <label className="text-xs text-slate-400">Observação (opcional)</label>
            <textarea value={observacao} onChange={(e) => setObservacao(e.target.value)} rows={3}
              placeholder="Comentários adicionais sobre o desempenho na semana..."
              className="mt-1 w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm resize-none" />
          </div>

          {preenchido && (
            <div className="bg-slate-800/60 rounded-xl p-3 flex items-center justify-between">
              <span className="text-sm text-slate-300">Média da semana</span>
              <div className="flex items-center gap-2">
                <span className="font-bold text-lg">{media.toFixed(1)}</span>
                <Badge cor={classificar(media).cor}>{classificar(media).label}</Badge>
              </div>
            </div>
          )}
          <DiagnosticoSemanaAtual funcionario={funcionario} mes={mes} semana={semana} scores={scores} />

            <div className="bg-red-500/10 border border-red-500/30 text-red-400 text-xs rounded-lg p-3">

          <button

            {salvando ? 'Salvando...' : 'Salvar avaliação'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================= MODAL HISTÓRICO ============================= */

function ModalHistorico({ funcionario, avaliacoes, onClose }) {
  const registros = avaliacoes
    .filter((a) => a.funcionarioId === funcionario.id)
    .sort((a, b) => (a.mes + a.semana).localeCompare(b.mes + b.semana));

  const porMes = {};
  registros.forEach((r) => {
    const m = mediaObj(r.scores);
    if (!porMes[r.mes]) porMes[r.mes] = [];
    porMes[r.mes].push({ semana: r.semana, media: m });
  });

  return (
    <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4 no-print">
      <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-xl max-h-[85vh] overflow-y-auto fade-in">
        <div className="p-5 border-b border-slate-800 flex items-center justify-between sticky top-0 bg-slate-900">
          <div>
            <h3 className="font-bold text-lg">Histórico — {funcionario.nome}</h3>
            <p className="text-xs text-slate-400">{funcionario.funcao}</p>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-white text-xl leading-none">×</button>
        </div>
        <div className="p-5 space-y-4">
          {Object.keys(porMes).length === 0 && <p className="text-sm text-slate-400">Nenhuma avaliação registrada.</p>}
          {Object.entries(porMes).map(([mes, semanas]) => {
            const mediaMes = semanas.reduce((a, s) => a + s.media, 0) / semanas.length;
            const cls = classificar(mediaMes);
            return (
              <div key={mes} className="bg-slate-800/50 rounded-xl p-4">
                <div className="flex items-center justify-between mb-2">
                  <span className="font-semibold text-sm">{MESES.find(m => m.id === mes)?.label || mes}</span>
                  <div className="flex items-center gap-2">
                    <span className="text-sm font-bold">{mediaMes.toFixed(1)} / 5</span>
                    <Badge cor={cls.cor}>{cls.label}</Badge>
                  </div>
                </div>
                <div className="flex gap-2 flex-wrap">
                  {semanas.sort((a, b) => a.semana - b.semana).map((s) => (
                    <span key={s.semana} className="text-xs bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-slate-300">
                      S{s.semana}: {s.media.toFixed(1)}
                    </span>
                  ))}
                </div>
              </div>
            );
          })}
          <AnaliseHistoricaDesenvolvimento funcionario={funcionario} registros={registros} />
        </div>
      </div>
    </div>
  );
}

/* ============================= PAINEL DE DIAGNÓSTICO INTELIGENTE ============================= */
/* Componente de apresentação, reutilizado em dois contextos:
   - DiagnosticoSemanaAtual: segue exatamente o mês/semana que o gestor está vendo/editando
     (mesmos filtros e médias da tela).
   - AnaliseHistoricaDesenvolvimento: painel separado, com visão histórica (mês mais recente
     com dados), para quem quiser uma leitura de evolução em vez do período pontual. */

function PainelDiagnosticoDesenvolvimento({ titulo, funcionario, mediaPorCriterio }) {
  if (!mediaPorCriterio || mediaPorCriterio.length === 0) return null;

  const criteriosBaixos = mediaPorCriterio.filter((c) => c.nota <= 2.4);
  const totalAbaixoDe3 = mediaPorCriterio.filter((c) => c.nota < 3).length;
  const pontosFortes = mediaPorCriterio.filter((c) => c.nota >= 4);

  // Todas as notas preenchidas >= 4 → relatório de reconhecimento
  if (criteriosBaixos.length === 0 && mediaPorCriterio.every((c) => c.nota >= 4)) {
    return (
      <div className="bg-gradient-to-br from-emerald-500/10 to-slate-800/50 border border-emerald-500/30 rounded-xl p-4 mt-2">
        <h4 className="font-bold text-sm text-emerald-400 mb-2">🏆 Reconhecimento de Desempenho — {titulo}</h4>
        <p className="text-xs text-slate-300 mb-3">
          {funcionario.nome} apresentou desempenho consistentemente acima do esperado em todos os critérios avaliados
          neste período, indicando maturidade na função de {funcionario.funcao} e alinhamento sólido com os padrões da loja.
        </p>
        <p className="text-[11px] font-semibold text-slate-400 mb-1">Competências consolidadas</p>
        <div className="flex flex-wrap gap-1.5 mb-3">
          {pontosFortes.map((c) => (
            <span key={c.id} className="text-[11px] bg-emerald-500/15 text-emerald-300 ring-1 ring-emerald-500/30 rounded-lg px-2 py-1">
              {c.label} · {c.nota.toFixed(1)}
            </span>
          ))}
        </div>
        <p className="text-[11px] text-slate-400">
          Recomenda-se reconhecer o desempenho junto à equipe, sustentar as práticas atuais e considerar o colaborador
          para novas responsabilidades ou trilhas de desenvolvimento contínuo.
        </p>
      </div>
    );
  }

  if (criteriosBaixos.length === 0) return null;

  const prioridade = calcularPrioridadeGeral_(criteriosBaixos, totalAbaixoDe3);
  const planoAcao = gerarPlanoAcao_(prioridade);
  const corPrioridade = COR_CLASSES[prioridade.cor];

  return (
    <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-4 mt-2 space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <h4 className="font-bold text-sm text-slate-200">📋 Diagnóstico Inteligente de Desenvolvimento — {titulo}</h4>
        <span className={`text-[11px] font-semibold rounded-lg px-2 py-1 ring-1 ${corPrioridade.bg} ${corPrioridade.text} ${corPrioridade.ring}`}>
          {prioridade.emoji} {prioridade.label}
        </span>
      </div>

      {criteriosBaixos.map((c) => {
        const conteudo = CONTEUDO_DIAGNOSTICO[c.id];
        if (!conteudo) return null;
        const prioridadeCriterio = calcularPrioridadeCriterio_(c.nota);
        const corCriterio = COR_CLASSES[prioridadeCriterio.cor];
        return (
          <div key={c.id} className="border-t border-slate-700/60 pt-3 first:border-t-0 first:pt-0">
            <div className="flex items-center justify-between mb-1.5 flex-wrap gap-1">
              <span className="text-xs font-semibold text-slate-200">
                {c.label} <span className="text-slate-500 font-normal">({c.nota.toFixed(1)}/5)</span>
              </span>
              <span className={`text-[10px] rounded px-1.5 py-0.5 ${corCriterio.bg} ${corCriterio.text}`}>
                {prioridadeCriterio.emoji} {prioridadeCriterio.label}
              </span>
            </div>
            <p className="text-xs text-slate-400 mb-2">
              <span className="text-slate-500">⚠ Diagnóstico — </span>
              {gerarDiagnosticoParagrafo_(c.label, c.nota, funcionario.funcao)}
            </p>
            <p className="text-[11px] font-semibold text-slate-500 mb-1">🔍 Possíveis causas</p>
            <ul className="text-[11px] text-slate-400 list-disc list-inside mb-2 space-y-0.5">
              {conteudo.causas.map((causa, i) => <li key={i}>{causa}</li>)}
            </ul>
            <p className="text-[11px] font-semibold text-slate-500 mb-1">📈 Impacto organizacional</p>
            <div className="flex flex-wrap gap-1 mb-2">
              {conteudo.impactos.map((imp, i) => (
                <span key={i} className="text-[10px] bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 text-slate-400">{imp}</span>
              ))}
            </div>
            <p className="text-[11px] text-slate-500">
              <span className="font-semibold">📚 Fundamentação — </span>Com base em {conteudo.fundamentacao}.
            </p>
          </div>
        );
      })}

      <div className="border-t border-slate-700/60 pt-3">
        <p className="text-[11px] font-semibold text-slate-500 mb-1">✅ Plano de ação sugerido para o gestor</p>
        <ul className="text-[11px] text-slate-400 list-disc list-inside space-y-0.5">
          {planoAcao.map((a, i) => <li key={i}>{a}</li>)}
        </ul>
      </div>

      <div className="border-t border-slate-700/60 pt-3">
        <p className="text-[11px] font-semibold text-slate-300 mb-1.5">Resumo executivo</p>
        <ul className="text-[11px] text-slate-400 space-y-1">
          <li><span className="text-slate-500">Pontos fortes:</span> {pontosFortes.length ? pontosFortes.map((c) => c.label).join(', ') : 'nenhuma competência acima de 4,0 neste período'}</li>
          <li><span className="text-slate-500">Oportunidades de melhoria:</span> {mediaPorCriterio.filter((c) => c.nota < 3).map((c) => c.label).join(', ') || '—'}</li>
          <li><span className="text-slate-500">Competências prioritárias:</span> {criteriosBaixos.map((c) => c.label).join(', ')}</li>
          <li><span className="text-slate-500">Grau geral de risco:</span> {prioridade.emoji} {prioridade.label}</li>
          <li><span className="text-slate-500">Necessidade de acompanhamento:</span> Sim, recomenda-se acompanhamento próximo do gestor</li>
          <li>
            <span className="text-slate-500">Plano de Desenvolvimento Individual (PDI):</span>{' '}
            {(prioridade.label === 'Prioridade Crítica' || prioridade.label === 'Atenção Imediata')
              ? 'Recomendado, dado o número de competências abaixo do esperado'
              : 'Não obrigatório neste momento; reavaliar conforme evolução'}
          </li>
          <li><span className="text-slate-500">Sugestão de nova avaliação:</span> Em até {prioridade.prazo} dias</li>
        </ul>
      </div>

      <p className="text-[10px] text-slate-600 italic pt-1">
        Diagnóstico gerado automaticamente a partir das notas registradas — serve como apoio à decisão do gestor,
        não como conclusão definitiva sobre o colaborador.
      </p>
    </div>
  );
}

/* Segue exatamente o mês e a semana que o gestor está vendo/editando neste modal —
   mesma fonte de dados (`scores`) usada no card "Média da semana" logo acima. */
function DiagnosticoSemanaAtual({ funcionario, mes, semana, scores }) {
  const criterios = criteriosDaFuncao(funcionario.funcao);
  const mediaPorCriterio = criterios
    .filter((c) => scores[c.id] !== undefined && scores[c.id] !== null)
    .map((c) => ({ ...c, nota: scores[c.id] }));

  return (
    <PainelDiagnosticoDesenvolvimento
      titulo={`${mes} · Semana ${semana}`}
      funcionario={funcionario}
      mediaPorCriterio={mediaPorCriterio}
    />
  );
}

/* Painel separado (fora dos filtros do dashboard): visão histórica, usando a semana mais
   recente registrada no histórico completo do colaborador — para quem quiser uma leitura
   de evolução em vez do período pontual selecionado na tela. Usa a semana isoladamente
   (não a média do mês), para não diluir uma semana ruim entre semanas boas. */
function AnaliseHistoricaDesenvolvimento({ funcionario, registros }) {
  if (registros.length === 0) return null;
  const criterios = criteriosDaFuncao(funcionario.funcao);
  const ultimoRegistro = registros[registros.length - 1]; // registros já vêm ordenados por mes+semana

  const mediaPorCriterio = criterios
    .filter((c) => ultimoRegistro.scores[c.id] !== undefined && ultimoRegistro.scores[c.id] !== null)
    .map((c) => ({ ...c, nota: ultimoRegistro.scores[c.id] }));

  const mesLabel = MESES.find((m) => m.id === ultimoRegistro.mes)?.label || ultimoRegistro.mes;

  return (
    <div>
      <p className="text-[11px] text-slate-500 mb-1.5">
        📊 Análise histórica — considera a semana mais recente registrada ({mesLabel} · Semana {ultimoRegistro.semana}), independente do filtro de mês selecionado no painel principal.
      </p>
      <PainelDiagnosticoDesenvolvimento
        titulo={`Análise Histórica · ${mesLabel} · Semana ${ultimoRegistro.semana}`}
        funcionario={funcionario}
        mediaPorCriterio={mediaPorCriterio}
      />
    </div>
  );
}

/* ============================= PAINEL DE EVOLUÇÃO TEMPORAL ============================= */
/* Visão dos colaboradores (da loja/filtro selecionados) ao longo de TODOS os meses e semanas
   já registrados na aba "Avaliacoes" — não só o mês em exibição na tabela principal. */

function PainelEvolucaoTemporal({ funcionarios, avaliacoes }) {
  const colunas = useMemo(() => (
    MESES.flatMap((m) => Array.from({ length: m.semanas }, (_, i) => ({
      key: `${m.id}-s${i + 1}`, mesId: m.id, semana: i + 1,
    })))
  ), []);

  function celula(funcionarioId, coluna) {
    const av = avaliacoes.find((a) => a.funcionarioId === funcionarioId && a.mes === coluna.mesId && a.semana === coluna.semana);
    return av ? mediaObj(av.scores) : null;
  }

  return (
    <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 mb-6 overflow-x-auto">
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <h3 className="text-sm font-semibold text-slate-300">📈 Evolução temporal — todos os meses e semanas</h3>
        <p className="text-xs text-slate-500">Cada célula é a média da semana (escala 1–5) · ▲/▼ compara a primeira com a última semana avaliada</p>
      </div>
      {funcionarios.length === 0 ? (
        <p className="text-xs text-slate-500">Nenhum colaborador nesta loja/filtro.</p>
      ) : (
        <table className="text-xs min-w-[900px] border-collapse">
          <thead>
            <tr>
              <th className="sticky left-0 bg-slate-900 py-1 pr-3 text-left text-slate-400 font-medium z-10">Colaborador</th>
              {MESES.map((m) => (
                <th key={m.id} colSpan={m.semanas} className="py-1 px-1 text-center text-slate-400 font-medium border-l border-slate-800">
                  {m.label}
                </th>
              ))}
            </tr>
            <tr>
              <th className="sticky left-0 bg-slate-900 pb-2 z-10"></th>
              {colunas.map((c) => (
                <th key={c.key} className="pb-2 px-1 text-center text-slate-500 font-normal">S{c.semana}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {funcionarios.map((f) => {
              const valores = colunas.map((c) => celula(f.id, c));
              const preenchidos = valores.filter((v) => v !== null);
              const tendencia = preenchidos.length >= 2 ? preenchidos[preenchidos.length - 1] - preenchidos[0] : 0;
              return (
                <tr key={f.id} className="border-t border-slate-800/60">
                  <td className="sticky left-0 bg-slate-900 py-1.5 pr-3 whitespace-nowrap z-10">
                    {f.nome}
                    {preenchidos.length >= 2 && (
                      <span className={`ml-2 text-[10px] ${tendencia > 0 ? 'text-emerald-400' : tendencia < 0 ? 'text-red-400' : 'text-slate-500'}`}>
                        {tendencia > 0 ? '▲' : tendencia < 0 ? '▼' : '—'}
                      </span>
                    )}
                  </td>
                  {valores.map((v, i) => {
                    const cor = v !== null ? COR_CLASSES[classificar(v).cor] : null;
                    return (
                      <td key={i} className="px-1 py-1.5 text-center">
                        {v !== null ? (
                          <span title={`${classificar(v).label} — ${v.toFixed(1)}`}
                            className={`inline-block w-9 rounded-md py-1 ${cor.bg} ${cor.text} ring-1 ${cor.ring}`}>
                            {v.toFixed(1)}
                          </span>
                        ) : (
                          <span className="text-slate-700">·</span>
                        )}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      )}
    </div>
  );
}

/* ============================= APP PRINCIPAL ============================= */

function App() {
  const [avaliacoes, setAvaliacoes] = useState([]);
  const [funcionarios, setFuncionarios] = useState([]);
  const [lojaId, setLojaId] = useState(LOJAS[0].id);
  const [funcaoFiltro, setFuncaoFiltro] = useState('Todas');
  const [mesId, setMesId] = useState('2026-07');
  const [modal, setModal] = useState(null); // { funcionario, semana }
  const [historico, setHistorico] = useState(null); // funcionario
  const [carregando, setCarregando] = useState(true);
  const [syncStatus, setSyncStatus] = useState('idle'); // idle | syncing | ok | erro
  const [syncErro, setSyncErro] = useState('');
  const [colaboradoresErro, setColaboradoresErro] = useState('');

  async function recarregar() {
    setSyncStatus('syncing');
    setSyncErro('');
    setColaboradoresErro('');
    setCarregando(true);

    try {
      const dados = await apiCarregarDados();

      // O backend é a fonte oficial dos dois conjuntos de dados.
      setFuncionarios(dados.funcionarios);
      setAvaliacoes(dados.avaliacoes);
      setSyncStatus('ok');
    } catch (err) {
      // Mesmo que o Apps Script falhe na leitura, tenta preservar o histórico
      // publicado em CSV. Isso não substitui o backend para salvar avaliações.
      try {
        const historico = await carregarHistoricoCSVFallback_();
        setAvaliacoes(historico);
      } catch (_) {
        setAvaliacoes([]);
      }

      setSyncStatus('erro');
      setSyncErro(err.message || String(err));

      setColaboradoresErro(
        'Não foi possível carregar a base de colaboradores pelo Apps Script. ' +
        'O Code.gs precisa retornar funcionarios[] a partir da aba base_colaboradores.'
      );
    } finally {
      setCarregando(false);
    }
  }

  useEffect(() => { recarregar(); }, []);

  const mesAtual = MESES.find((m) => m.id === mesId);
  const funcionariosLoja = funcionarios.filter((f) => f.ativo !== false && f.lojaId === lojaId && (funcaoFiltro === 'Todas' || f.funcao === funcaoFiltro));

  function avaliacaoDe(funcionarioId, semana) {
    return avaliacoes.find((a) => a.funcionarioId === funcionarioId && a.mes === mesId && a.semana === semana);
  }

  function mediaMensal(funcionarioId) {
    const regs = avaliacoes.filter((a) => a.funcionarioId === funcionarioId && a.mes === mesId);
    if (!regs.length) return null;
    const medias = regs.map((r) => mediaObj(r.scores));
    return medias.reduce((a, b) => a + b, 0) / medias.length;
  }

  async function salvarAvaliacao(funcionario, semana, payload) {
    const idExistente = `${funcionario.id}-${mesId}-s${semana}`;
    const registro = {
      id: idExistente,
      funcionarioId: funcionario.id,
      lojaId: funcionario.lojaId,
      mes: mesId,
      semana,
      data: payload.data,
      gestor: payload.gestor,
      scores: payload.scores,
      observacao: payload.observacao,
    };
    const salvo = await apiSalvarAvaliacao(registro); // deixa o erro propagar para o modal tratar
    setAvaliacoes((prev) => {
      const semExistente = prev.filter((a) => a.id !== idExistente);
      return [...semExistente, salvo];
    });
    setModal(null);
  }

  /* ---- Cálculos agregados para a loja/mês selecionados ---- */
  const linhasFuncionarios = funcionariosLoja.map((f) => {
    const media = mediaMensal(f.id);
    const cls = media !== null ? classificar(media) : null;
    const semanasPreenchidas = [];
    for (let s = 1; s <= mesAtual.semanas; s++) {
      const av = avaliacaoDe(f.id, s);
      semanasPreenchidas.push(av ? mediaObj(av.scores) : null);
    }
    return { funcionario: f, media, cls, semanas: semanasPreenchidas };
  });

  const avaliados = linhasFuncionarios.filter((l) => l.media !== null);
  const mediaLoja = avaliados.length ? avaliados.reduce((a, l) => a + l.media, 0) / avaliados.length : 0;
  const countPorClasse = { Excelente: 0, Bom: 0, Regular: 0, 'Necessita desenvolvimento': 0 };
  avaliados.forEach((l) => { countPorClasse[l.cls.label]++; });

  const ranking = [...avaliados].sort((a, b) => b.media - a.media);
  const melhores = ranking.slice(0, 3);
  const precisamDesenvolver = [...avaliados].sort((a, b) => a.media - b.media).slice(0, 3);

  /* ---- Evolução mensal da loja (todos os meses) ---- */
  const evolucaoLabels = MESES.map((m) => m.label);
  const evolucaoData = MESES.map((m) => {
    const regs = avaliacoes.filter((a) => a.lojaId === lojaId && a.mes === m.id);
    if (!regs.length) return 0;
    const porFuncionario = {};
    regs.forEach((r) => {
      if (!porFuncionario[r.funcionarioId]) porFuncionario[r.funcionarioId] = [];
      porFuncionario[r.funcionarioId].push(mediaObj(r.scores));
    });
    const medias = Object.values(porFuncionario).map((arr) => arr.reduce((a, b) => a + b, 0) / arr.length);
    return +(medias.reduce((a, b) => a + b, 0) / medias.length).toFixed(2);
  });

  /* ---- Comparação entre funções (mês/loja atual) ---- */
  const funcoes = ['Farmacêutico', 'Balconista', 'Caixa', 'Auxiliar de Logística', 'Administrativo'];
  const comparacaoFuncao = funcoes.map((fn) => {
    const ids = funcionarios.filter((f) => f.lojaId === lojaId && f.funcao === fn).map((f) => f.id);
    const medias = ids.map((id) => mediaMensal(id)).filter((m) => m !== null);
    return medias.length ? +(medias.reduce((a, b) => a + b, 0) / medias.length).toFixed(2) : 0;
  });

  /* ---- Exportações ---- */
  function exportarExcel() {
    const linhas = linhasFuncionarios.map((l) => {
      const row = {
        Funcionário: l.funcionario.nome,
        Função: l.funcionario.funcao,
        Loja: LOJAS.find((lj) => lj.id === lojaId).nome,
        Mês: mesAtual.label,
      };
      l.semanas.forEach((s, i) => { row[`Semana ${i + 1}`] = s !== null ? s.toFixed(1) : '-'; });
      row['Média Mensal (0-5)'] = l.media !== null ? l.media.toFixed(2) : '-';
      row['Média Mensal (0-100)'] = l.media !== null ? (l.media * 20).toFixed(0) : '-';
      row['Classificação'] = l.cls ? l.cls.label : '-';
      return row;
    });
    const ws = XLSX.utils.json_to_sheet(linhas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Avaliações');
    XLSX.writeFile(wb, `Avaliacao_Desempenho_${lojaId}_${mesId}.xlsx`);
  }

  function exportarPDF() { window.print(); }

  const lojaAtual = LOJAS.find((l) => l.id === lojaId);

  if (carregando) {
    return (
      <div className="max-w-7xl mx-auto p-6 flex flex-col items-center justify-center min-h-[60vh] text-slate-400">
        <div className="text-3xl mb-3">⏳</div>
        <p className="text-sm">Carregando colaboradores e histórico da planilha...</p>
      </div>
    );
  }

  return (
    <div className="max-w-7xl mx-auto p-4 md:p-6 print-area">
      {CONFIG.API_URL === 'COLE_AQUI_A_URL_DO_APPS_SCRIPT' && (
        <div className="no-print bg-amber-500/10 border border-amber-500/30 text-amber-300 text-sm rounded-xl p-4 mb-6">
          ⚠️ <strong>Backend não configurado.</strong> O Web App do Apps Script precisa estar publicado
          como "Qualquer pessoa" e retornar <code className="bg-slate-800 px-1.5 py-0.5 rounded">funcionarios[]</code>
          e <code className="bg-slate-800 px-1.5 py-0.5 rounded">avaliacoes[]</code>. Sem isso, os botões de avaliação
          não conseguem ser montados.
        </div>
      )}
      {colaboradoresErro && (
        <div className="no-print bg-red-500/10 border border-red-500/30 text-red-300 text-sm rounded-xl p-4 mb-6">
          ⚠️ <strong>Falha ao carregar os colaboradores.</strong> {colaboradoresErro}
          {' '}A aba <code className="bg-slate-800 px-1.5 py-0.5 rounded">base_colaboradores</code> deve conter
          <code className="bg-slate-800 px-1.5 py-0.5 rounded">id, nome, funcao, lojaId, ativo</code> e o Apps Script
          deve devolvê-la em <code className="bg-slate-800 px-1.5 py-0.5 rounded">funcionarios[]</code>.
        </div>
      )}
      {/* HEADER */}
      <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
        <div>
          <h1 className="text-2xl font-bold tracking-tight">Avaliação de Desempenho Inteligente</h1>
          <p className="text-slate-400 text-sm mt-1">FarmaRede · Avaliação semanal objetiva, com consolidação mensal automática</p>
        </div>
        <div className="flex gap-2 no-print items-center">
          <SyncStatus status={syncStatus} erro={syncErro} onRetry={recarregar} />
          <button onClick={recarregar} className="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-sm font-medium flex items-center gap-2">
            🔄 Atualizar
          </button>
          <button onClick={exportarExcel} className="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-sm font-medium flex items-center gap-2">
            📊 Exportar Excel

          </button>
          <button onClick={exportarPDF} className="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-sm font-medium flex items-center gap-2">
            🖨️ Exportar PDF
          </button>
        </div>
      </div>

      {/* FILTROS */}
      <div className="flex flex-wrap gap-3 mb-6 no-print">
        <select value={lojaId} onChange={(e) => setLojaId(e.target.value)}
          className="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm">
          {LOJAS.map((l) => <option key={l.id} value={l.id}>{l.nome}</option>)}
        </select>
        <select value={funcaoFiltro} onChange={(e) => setFuncaoFiltro(e.target.value)}
          className="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm">
          <option value="Todas">Todas as funções</option>
          {funcoes.map((f) => <option key={f} value={f}>{f}</option>)}
        </select>
        <select value={mesId} onChange={(e) => setMesId(e.target.value)}
          className="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm">
          {MESES.map((m) => <option key={m.id} value={m.id}>{m.label}</option>)}
        </select>
      </div>

      {/* KPIs */}
      <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
        <KpiCard label="Média geral da loja" value={mediaLoja ? mediaLoja.toFixed(1) : '-'} sub={mediaLoja ? `${(mediaLoja * 20).toFixed(0)} / 100` : ''} />
        <KpiCard label="Colaboradores avaliados" value={avaliados.length} sub={`de ${funcionariosLoja.length} na loja`} />
        <KpiCard label="Excelente" value={countPorClasse['Excelente']} cor="emerald" />
        <KpiCard label="Bom" value={countPorClasse['Bom']} cor="blue" />
        <KpiCard label="Necessita desenvolvimento" value={countPorClasse['Necessita desenvolvimento']} cor="red" />
      </div>

      {/* GRÁFICOS */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
        <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-4">
          <h3 className="text-sm font-semibold mb-2 text-slate-300">Evolução mensal — {lojaAtual.nome}</h3>
          <div style={{ height: 220 }}><LineChart labels={evolucaoLabels} data={evolucaoData} id="evolucao" /></div>
        </div>
        <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-4">
          <h3 className="text-sm font-semibold mb-2 text-slate-300">Comparação entre funções — {mesAtual.label}</h3>
          <div style={{ height: 220 }}>
            <BarChart labels={funcoes} data={comparacaoFuncao} colors={['#818cf8', '#34d399', '#fbbf24']} id="comparacao" />
          </div>
        </div>
      </div>

      {/* RANKINGS */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-4">
          <h3 className="text-sm font-semibold mb-3 text-slate-300">🏆 Melhores desempenhos</h3>
          {melhores.length === 0 && <p className="text-xs text-slate-500">Sem avaliações neste mês.</p>}
          <div className="space-y-2">
            {melhores.map((l, i) => (
              <div key={l.funcionario.id} className="flex items-center justify-between bg-slate-800/50 rounded-lg px-3 py-2">
                <span className="text-sm"><span className="text-slate-500 mr-2">#{i + 1}</span>{l.funcionario.nome}</span>
                <Badge cor={l.cls.cor}>{l.media.toFixed(1)}</Badge>
              </div>
            ))}
          </div>
        </div>
        <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-4">
          <h3 className="text-sm font-semibold mb-3 text-slate-300">⚠️ Necessitam desenvolvimento</h3>
          {precisamDesenvolver.length === 0 && <p className="text-xs text-slate-500">Sem avaliações neste mês.</p>}
          <div className="space-y-2">
            {precisamDesenvolver.map((l) => (
              <div key={l.funcionario.id} className="flex items-center justify-between bg-slate-800/50 rounded-lg px-3 py-2">
                <span className="text-sm">{l.funcionario.nome}</span>
                <Badge cor={l.cls.cor}>{l.media.toFixed(1)}</Badge>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* TABELA DETALHADA */}
      <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 mb-6 overflow-x-auto">
        <h3 className="text-sm font-semibold mb-3 text-slate-300">Detalhamento — {lojaAtual.nome} · {mesAtual.label}</h3>
        <table className="w-full text-sm min-w-[720px]">
          <thead>
            <tr className="text-left text-slate-400 border-b border-slate-800">
              <th className="py-2 pr-3">Funcionário</th>
              <th className="py-2 pr-3">Função</th>
              {Array.from({ length: mesAtual.semanas }).map((_, i) => (
                <th key={i} className="py-2 px-2 text-center">S{i + 1}</th>
              ))}
              <th className="py-2 px-2 text-center">Mensal</th>
              <th className="py-2 px-2 text-center">/100</th>
              <th className="py-2 px-2">Classificação</th>
              <th className="py-2 px-2 no-print"></th>
            </tr>
          </thead>
          <tbody>
            {linhasFuncionarios.map((l) => (
              <tr key={l.funcionario.id} className="border-b border-slate-800/60 hover:bg-slate-800/30">
                <td className="py-2 pr-3 font-medium">{l.funcionario.nome}</td>
                <td className="py-2 pr-3 text-slate-400">
                  {l.funcionario.funcao || <span className="text-amber-400 text-xs">⚠ função pendente</span>}
                </td>
                {l.semanas.map((s, i) => (
                  <td key={i} className="py-2 px-2 text-center">
                    {s !== null ? (
                      <span className="text-slate-200">{s.toFixed(1)}</span>
                    ) : l.funcionario.funcao ? (
                      <button onClick={() => setModal({ funcionario: l.funcionario, semana: i + 1 })}
                        className="no-print text-xs text-indigo-400 hover:text-indigo-300 underline">
                        avaliar
                      </button>
                    ) : (
                      <span className="text-slate-600 text-xs">—</span>
                    )}
                  </td>
                ))}
                <td className="py-2 px-2 text-center font-bold">{l.media !== null ? l.media.toFixed(1) : '-'}</td>
                <td className="py-2 px-2 text-center text-slate-400">{l.media !== null ? (l.media * 20).toFixed(0) : '-'}</td>
                <td className="py-2 px-2">{l.cls ? <Badge cor={l.cls.cor}>{l.cls.label}</Badge> : <span className="text-slate-500 text-xs">Sem dados</span>}</td>
                <td className="py-2 px-2 no-print text-right">
                  <button onClick={() => setHistorico(l.funcionario)} className="text-xs text-slate-400 hover:text-white underline">histórico</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* EVOLUÇÃO TEMPORAL — COLABORADORES x MESES/SEMANAS */}
      <PainelEvolucaoTemporal funcionarios={funcionariosLoja} avaliacoes={avaliacoes} />

      <p className="text-xs text-slate-600 text-center pb-4">
        Todas as avaliações ficam registradas com data, gestor responsável, loja, funcionário, notas e observações — servindo como documentação formal do processo.
      </p>

      {modal && (
        <ModalAvaliacao
          funcionario={modal.funcionario}
          mes={mesAtual.label}
          semana={modal.semana}
          existente={avaliacaoDe(modal.funcionario.id, modal.semana)}
          onClose={() => setModal(null)}
          onSave={(payload) => salvarAvaliacao(modal.funcionario, modal.semana, payload)}
        />
      )}
      {historico && (
        <ModalHistorico funcionario={historico} avaliacoes={avaliacoes} onClose={() => setHistorico(null)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
